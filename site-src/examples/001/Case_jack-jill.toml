generic = [ [ [ 60.0, 40.0, 0.0, 0.0,], [ 70.0, 30.0, 0.0, 0.0,],], [ [ 50.0, 50.0, 0.0, 0.0,], [ 70.0, 30.0, 0.0, 0.0,],],]

