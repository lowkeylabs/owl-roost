title = "Workspace"

description = """\
[Provide a description of the workspace - the household,
the types of experiments, etc.  This description complements
the description already found in the household/case TOML.]
"""

# -----------------------------------------------------
# Context Paths
# -----------------------------------------------------
#
# These values override the default planning
# context path observations.
#
[context.paths]

cases = "."  # change to "./cases" for a cleaner workspace.
results = "./results"

# -----------------------------------------------------
# Household Libraries
# -----------------------------------------------------
#
# Override the default household libraries visible to
# this workspace.
#
# Household libraries are searched in the order listed.
#
# 1. workspace
#    Household definitions local to this workspace.
#
# 2. user
#    Household definitions available to the current user.
#
# 3. builtin
#    Household definitions distributed with ROOST.
#

[[context.households]]
name = "workspace"
location = "./library/households"

[[context.households]]
name = "user"
location = "~/.roost/library/households"

[[context.households]]
name = "builtin"
location = "library/households"


[workspace]

# These overrides are added to the command line for
# every build command.  Care should be exercised to ensure
# that they don't override an experiment or orphan
# override.

overrides=[
]
